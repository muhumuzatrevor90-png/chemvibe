<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ChemVibe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <div class="auth-intro">
      <div>
        <a class="brand brand-light" href="index.html">
          <span class="logo-mark" aria-hidden="true"><span></span><i></i><b></b></span>ChemVibe
        </a>
        <span class="eyebrow" style="margin-top: 24px;">YOUR CHEMISTRY STUDY SPACE</span>
      </div>
      <div>
        <h1>Welcome back to <span>ChemVibe</span>.</h1>
        <p>Sign in to access your study profile and student space.</p>
      </div>
      <small>© ChemVibe Study Platform</small>
    </div>

    <div class="auth-side">
      <div class="auth-card">
        <h2>Sign in</h2>
        <p class="muted">Enter your email and password.</p>
        
        <form id="signin-form">
          <label class="field-label">Email
            <input class="field" id="signin-email" type="email" required placeholder="student@university.edu">
          </label>
          
          <label class="field-label">Password
            <div style="position: relative;">
              <input class="field" id="signin-password" type="password" required placeholder="••••••••" style="padding-right: 44px; width: 100%;">
              <button type="button" id="toggle-signin-password" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--muted);">👁️</button>
            </div>
          </label>

          <button class="button primary full" type="submit" id="signin-submit" style="margin-top: 8px;">Sign in</button>
          <p class="status" id="signin-status" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-foot">New to ChemVibe? <a href="signup.html">Create account</a></p>
        <a class="back-link" href="index.html">← Back to library</a>
      </div>
    </div>
  </div>

  <script type="module" src="auth-signin.js"></script>
</body>
</html>
