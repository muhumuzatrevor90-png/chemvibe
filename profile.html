<!-- Add this section inside <main class="container"> in profile.html -->
<section class="panel form-panel" style="margin-top: 24px;">
  <h2>Change Password</h2>
  <p class="muted">Update your account password securely.</p>
  <form id="password-change-form">
    <label class="field-label">Current Password
      <div style="position: relative;">
        <input class="field" id="current-password" type="password" required placeholder="Enter current password" style="padding-right: 40px;">
        <button type="button" class="password-toggle" data-target="current-password" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem;">👁️</button>
      </div>
    </label>
    <label class="field-label">New Password
      <div style="position: relative;">
        <input class="field" id="new-password" type="password" required placeholder="Enter new password (min. 6 characters)" style="padding-right: 40px;">
        <button type="button" class="password-toggle" data-target="new-password" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem;">👁️</button>
      </div>
    </label>
    <button class="button primary" id="password-submit" type="submit">Update Password</button>
    <p class="status" id="password-status" role="status" aria-live="polite" style="margin-top: 10px;"></p>
  </form>
</section>
